<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1040 280"
  aria-hidden="true"
>
  <g stroke="var(--sc-border)" stroke-width="2">
    <line x1="260" y1="80" x2="145" y2="160" />
    <line x1="260" y1="80" x2="375" y2="160" />
    <line x1="780" y1="80" x2="665" y2="160" />
    <line x1="665" y1="160" x2="780" y2="240" />
  </g>

  <g fill="var(--sc-code-bg)" stroke="var(--sc-border)" stroke-width="2">
    <circle
      cx="260"
      cy="80"
      r="26"
      stroke="var(--sc-accent)"
      stroke-width="2.5"
    />
    <circle cx="145" cy="160" r="26" />
    <circle cx="375" cy="160" r="26" />
    <circle
      cx="780"
      cy="80"
      r="26"
      stroke="var(--sc-accent)"
      stroke-width="2.5"
    />
    <circle cx="665" cy="160" r="26" />
    <circle cx="780" cy="240" r="26" />
  </g>

  <g
    fill="var(--sc-text)"
    font-family="var(--sc-font-mono)"
    font-size="20"
    font-weight="600"
    text-anchor="middle"
    dominant-baseline="central"
  >
    <text x="260" y="80" fill="var(--sc-accent)">4</text>
    <text x="145" y="160">1</text>
    <text x="375" y="160">9</text>
    <text x="780" y="80" fill="var(--sc-accent)">4</text>
    <text x="665" y="160">1</text>
    <text x="780" y="240">9</text>
  </g>

  <g
    fill="var(--sc-muted)"
    font-family="var(--sc-font-text)"
    font-size="15"
    font-weight="600"
    letter-spacing="1.5"
    text-anchor="middle"
  >
    <text x="260" y="22">Tree A</text>
    <text x="780" y="22">Tree B</text>
  </g>
