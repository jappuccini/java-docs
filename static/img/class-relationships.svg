    <rect x="620" y="12" width="150" height="52" rx="8" />
    <rect x="240" y="124" width="170" height="78" rx="8" />
    <rect x="620" y="124" width="230" height="78" rx="8" />
    <rect x="240" y="244" width="170" height="78" rx="8" />
    <rect x="620" y="244" width="230" height="78" rx="8" />
